      /* =======================================================================
         3. SEAMLESS 512x512 POT 4-CHANNEL RGBA NOISE LUT GENERATOR
         ======================================================================= */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function addPeriodicOctave(outBuf, size, px, py, amp, rand, ridged) {
        const grid = new Float32Array(px * py);
        for (let i = 0; i < grid.length; i++) {
          grid[i] = rand();
        }

        const ix0 = new Int32Array(size);
        const ix1 = new Int32Array(size);
        const fx = new Float32Array(size);
        const maskX = px - 1;
        const scaleX = px / size;
        for (let x = 0; x < size; x++) {
          const gx = x * scaleX;
          const i0 = gx | 0;
          const t = gx - i0;
          ix0[x] = i0 & maskX;
          ix1[x] = (i0 + 1) & maskX;
          fx[x] = t * t * (3.0 - 2.0 * t);
        }

        const iy0 = new Int32Array(size);
        const iy1 = new Int32Array(size);
        const fy = new Float32Array(size);
        const maskY = py - 1;
        const scaleY = py / size;
        for (let y = 0; y < size; y++) {
          const gy = y * scaleY;
          const i0 = gy | 0;
          const t = gy - i0;
          iy0[y] = (i0 & maskY) * px;
          iy1[y] = ((i0 + 1) & maskY) * px;
          fy[y] = t * t * (3.0 - 2.0 * t);
        }

        let idx = 0;
        for (let y = 0; y < size; y++) {
          const row0 = iy0[y];
          const row1 = iy1[y];
          const wy = fy[y];
          for (let x = 0; x < size; x++) {
            const x0 = ix0[x];
            const x1 = ix1[x];
            const wx = fx[x];

            const v00 = grid[row0 + x0];
            const v10 = grid[row0 + x1];
            const v01 = grid[row1 + x0];
            const v11 = grid[row1 + x1];

            const top = v00 + (v10 - v00) * wx;
            const bot = v01 + (v11 - v01) * wx;
            let val = top + (bot - top) * wy;

            if (ridged) {
              val = 1.0 - Math.abs(val * 2.0 - 1.0);
              val = val * val;
            }
            outBuf[idx++] += val * amp;
          }
        }
      }

      /**
       * Generates a seamless 512x512 POT RGBA texture with mipmaps:
       *  R: Low-frequency billowing plasma clouds (fBM)
       *  G: Mid-frequency turbulence & dark dust lanes
       *  B: High-frequency ridged filaments
       *  A: Fine anisotropic concentric/spiral streaks (high radial frequency, long azimuthal flow)
       */
      function createSeamlessNoiseTexture() {
        const size = 512;
        const count = size * size;
        const chR = new Float32Array(count);
        const chG = new Float32Array(count);
        const chB = new Float32Array(count);
        const chA = new Float32Array(count);

        const rand = mulberry32(20141107);

        // R: Low-frequency plasma clouds (smooth, azimuthal-stretched)
        addPeriodicOctave(chR, size, 4,   8,  0.48, rand, false);
        addPeriodicOctave(chR, size, 8,  16,  0.28, rand, false);
        addPeriodicOctave(chR, size, 16, 32,  0.15, rand, false);
        addPeriodicOctave(chR, size, 32, 64,  0.09, rand, false);

        // G: Mid-frequency turbulence & dark espresso dust veins
        addPeriodicOctave(chG, size, 4,  16,  0.40, rand, false);
        addPeriodicOctave(chG, size, 8,  32,  0.32, rand, true);
        addPeriodicOctave(chG, size, 16, 64,  0.18, rand, false);
        addPeriodicOctave(chG, size, 32, 128, 0.10, rand, false);

        // B: High-frequency ridged luminous filaments
        addPeriodicOctave(chB, size, 4,  32,  0.38, rand, true);
        addPeriodicOctave(chB, size, 8,  64,  0.34, rand, true);
        addPeriodicOctave(chB, size, 16, 128, 0.28, rand, true);

        // A: Ultra-sleek anisotropic concentric-to-spiral silk streaks
        addPeriodicOctave(chA, size, 2,  64,  0.38, rand, true);
        addPeriodicOctave(chA, size, 4,  128, 0.36, rand, true);
        addPeriodicOctave(chA, size, 8,  256, 0.26, rand, true);

        const pixels = new Uint8Array(count * 4);
        for (let i = 0; i < count; i++) {
          const o = i * 4;
          pixels[o]     = Math.max(0, Math.min(255, Math.round(chR[i] * 255)));
          pixels[o + 1] = Math.max(0, Math.min(255, Math.round(chG[i] * 255)));
          pixels[o + 2] = Math.max(0, Math.min(255, Math.round(chB[i] * 255)));
          pixels[o + 3] = Math.max(0, Math.min(255, Math.round(chA[i] * 255)));
        }

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.bindTexture(gl.TEXTURE_2D, null);
        return tex;
      }

      /* =======================================================================
         4. WEBGL 1.0 ENGINE WITH 3-TIER FBO FALLBACK & DIAGNOSTIC OVERLAY
         ======================================================================= */
      const canvas = document.getElementById("glcanvas");
      const fpsBadgeEl = document.getElementById("fpsBadge");
      const scaleValEl = document.getElementById("scaleVal");
      const errorOverlayEl = document.getElementById("errorOverlay");
      const errorMessageEl = document.getElementById("errorMessage");
      const errorLogEl = document.getElementById("errorLog");

      let gl = null;
      let fboMode = "direct"; // "half_float" | "rgba8" | "direct"
      let fboType = 0;
      let useHDREncode = false;
      let noiseTex = null;
      let quadVbo = null;
      let programs = {};
      let fbos = {};
      let rafId = null;

      function showDiagnosticError(message, detailLog) {
        console.error("[Gargantua WebGL Error]", message, detailLog || "");
        if (errorMessageEl) errorMessageEl.textContent = message;
        if (errorLogEl) errorLogEl.textContent = detailLog || "詳細ログなし";
        if (errorOverlayEl) errorOverlayEl.style.display = "flex";
      }

      function compileShader(type, source, label) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(shader) || "Unknown shader compile error";
          gl.deleteShader(shader);
          throw new Error("[" + label + "] Shader Compile Failed:\n" + log);
        }
        return shader;
      }

      function createProgram(vertSrc, fragSrc, label) {
        const vs = compileShader(gl.VERTEX_SHADER, vertSrc, label + " VS");
        const fs = compileShader(gl.FRAGMENT_SHADER, fragSrc, label + " FS");
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.deleteShader(vs);
        gl.deleteShader(fs);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          const log = gl.getProgramInfoLog(prog) || "Unknown program link error";
          gl.deleteProgram(prog);
          throw new Error("[" + label + "] Program Link Failed:\n" + log);
        }
        return prog;
      }

      function testFboRenderable(texType) {
        const tex = gl.createTexture();
        const fbo = gl.createFramebuffer();
        let complete = false;

        try {
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 8, 8, 0, gl.RGBA, texType, null);

          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          complete = (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE);
        } catch (e) {
          complete = false;
        }

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.deleteFramebuffer(fbo);
        gl.deleteTexture(tex);
        return complete;
      }

      function detectSafeFboMode() {
        const extHalf = gl.getExtension("OES_texture_half_float");
        const extHalfLinear = gl.getExtension("OES_texture_half_float_linear");
        gl.getExtension("EXT_color_buffer_half_float");

        if (extHalf && extHalfLinear && testFboRenderable(extHalf.HALF_FLOAT_OES)) {
          fboMode = "half_float";
          fboType = extHalf.HALF_FLOAT_OES;
          useHDREncode = false;
          return;
        }

        if (testFboRenderable(gl.UNSIGNED_BYTE)) {
          fboMode = "rgba8";
          fboType = gl.UNSIGNED_BYTE;
          useHDREncode = true;
          return;
        }

        fboMode = "direct";
        fboType = gl.UNSIGNED_BYTE;
        useHDREncode = false;
      }

      function createFbo(width, height) {
        const w = Math.max(2, Math.floor(width));
        const h = Math.max(2, Math.floor(height));

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, fboType, null);

        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);

        if (status !== gl.FRAMEBUFFER_COMPLETE) {
          gl.deleteFramebuffer(fbo);
          gl.deleteTexture(tex);
          return null;
        }

        return { fbo: fbo, tex: tex, width: w, height: h };
      }

      function destroyFbo(target) {
        if (!target) return;
        if (target.fbo) gl.deleteFramebuffer(target.fbo);
        if (target.tex) gl.deleteTexture(target.tex);
      }

      function destroyAllFbos() {
        Object.keys(fbos).forEach(function (k) {
          destroyFbo(fbos[k]);
        });
        fbos = {};
      }

      function updateScaleReadout() {
        const preset = QUALITY_PRESETS[state.quality] || QUALITY_PRESETS.balanced;
        const effPct = Math.round(preset.resScale * state.drsScale * 100);
        if (scaleValEl) {
          scaleValEl.textContent = effPct + "%";
        }
      }

      function rebuildFbos() {
        const preset = QUALITY_PRESETS[state.quality] || QUALITY_PRESETS.balanced;
        const cssW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 800);
        const cssH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 600);

        const displayDpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.max(1, Math.floor(cssW * displayDpr));
        canvas.height = Math.max(1, Math.floor(cssH * displayDpr));

        destroyAllFbos();

        if (fboMode === "direct") {
          updateScaleReadout();
          return;
        }

        const combinedScale = preset.resScale * state.drsScale;
        let sceneW = cssW * combinedScale;
        let sceneH = cssH * combinedScale;
        const maxSide = Math.max(sceneW, sceneH);
        if (maxSide > preset.maxDim) {
          const cap = preset.maxDim / maxSide;
          sceneW *= cap;
          sceneH *= cap;
        }
        sceneW = Math.max(120, Math.floor(sceneW));
        sceneH = Math.max(90, Math.floor(sceneH));

        const qW = Math.max(24, Math.floor(sceneW * 0.25));
        const qH = Math.max(24, Math.floor(sceneH * 0.25));
        const eW = Math.max(14, Math.floor(sceneW * 0.125));
        const eH = Math.max(14, Math.floor(sceneH * 0.125));
        const sW = Math.max(10, Math.floor(sceneW * 0.0625));
        const sH = Math.max(10, Math.floor(sceneH * 0.0625));

        const created = {
          scene: createFbo(sceneW, sceneH),
          bright: createFbo(qW, qH),
          tightPing: createFbo(qW, qH),
          tightPong: createFbo(qW, qH),
          midPing: createFbo(eW, eH),
          midPong: createFbo(eW, eH),
          widePing: createFbo(sW, sH),
          widePong: createFbo(sW, sH),
          anamPing: createFbo(eW, eH),
          anamPong: createFbo(eW, eH)
        };

        const allOk = Object.keys(created).every(function (k) {
          return created[k] !== null;
        });

        if (allOk) {
          fbos = created;
        } else {
          Object.keys(created).forEach(function (k) {
            destroyFbo(created[k]);
          });
          if (fboMode === "half_float" && testFboRenderable(gl.UNSIGNED_BYTE)) {
            fboMode = "rgba8";
            fboType = gl.UNSIGNED_BYTE;
            useHDREncode = true;
            rebuildFbos();
            return;
          }
          fboMode = "direct";
          useHDREncode = false;
        }

        updateScaleReadout();
      }

      function initWebGL() {
        const opts = {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          powerPreference: "high-performance",
          preserveDrawingBuffer: false
        };

        gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
        if (!gl) {
          showDiagnosticError(
            "WebGL 1.0 コンテキストを作成できませんでした。ブラウザのハードウェアアクセラレーションを有効にして再読み込みしてください。",
            "canvas.getContext('webgl') returned null"
          );
          return false;
        }

        try {
          programs.blackhole = createProgram(VERT_QUAD, FRAG_BLACKHOLE, "BlackHole");
          programs.bright = createProgram(VERT_QUAD, FRAG_BRIGHTPASS, "BrightPass");
          programs.blur = createProgram(VERT_QUAD, FRAG_BLUR, "GaussianBlur");
          programs.composite = createProgram(VERT_QUAD, FRAG_COMPOSITE, "Composite");
        } catch (err) {
          showDiagnosticError(
            "GLSL シェーダーのコンパイルまたはリンクに失敗しました。",
            err && err.message ? err.message : String(err)
          );
          return false;
        }

        detectSafeFboMode();
        noiseTex = createSeamlessNoiseTexture();

        programs.bhLoc = {
          a_pos: gl.getAttribLocation(programs.blackhole, "a_pos"),
          u_noiseTex: gl.getUniformLocation(programs.blackhole, "u_noiseTex"),
          u_resolution: gl.getUniformLocation(programs.blackhole, "u_resolution"),
          u_time: gl.getUniformLocation(programs.blackhole, "u_time"),
          u_camPos: gl.getUniformLocation(programs.blackhole, "u_camPos"),
          u_camRight: gl.getUniformLocation(programs.blackhole, "u_camRight"),
          u_camUp: gl.getUniformLocation(programs.blackhole, "u_camUp"),
          u_camForward: gl.getUniformLocation(programs.blackhole, "u_camForward"),
          u_fovScale: gl.getUniformLocation(programs.blackhole, "u_fovScale"),
          u_diskSpeed: gl.getUniformLocation(programs.blackhole, "u_diskSpeed"),
          u_maxSteps: gl.getUniformLocation(programs.blackhole, "u_maxSteps"),
          u_stepScale: gl.getUniformLocation(programs.blackhole, "u_stepScale"),
          u_encodeHDR: gl.getUniformLocation(programs.blackhole, "u_encodeHDR"),
          u_directOutput: gl.getUniformLocation(programs.blackhole, "u_directOutput")
        };

        programs.brightLoc = {
          a_pos: gl.getAttribLocation(programs.bright, "a_pos"),
          u_tex: gl.getUniformLocation(programs.bright, "u_tex"),
          u_texelSize: gl.getUniformLocation(programs.bright, "u_texelSize"),
          u_decodeHDR: gl.getUniformLocation(programs.bright, "u_decodeHDR")
        };

        programs.blurLoc = {
          a_pos: gl.getAttribLocation(programs.blur, "a_pos"),
          u_tex: gl.getUniformLocation(programs.blur, "u_tex"),
          u_direction: gl.getUniformLocation(programs.blur, "u_direction"),
          u_decodeHDR: gl.getUniformLocation(programs.blur, "u_decodeHDR")
        };

        programs.compLoc = {
          a_pos: gl.getAttribLocation(programs.composite, "a_pos"),
          u_sceneTex: gl.getUniformLocation(programs.composite, "u_sceneTex"),
          u_bloomTightTex: gl.getUniformLocation(programs.composite, "u_bloomTightTex"),
          u_bloomMidTex: gl.getUniformLocation(programs.composite, "u_bloomMidTex"),
          u_bloomWideTex: gl.getUniformLocation(programs.composite, "u_bloomWideTex"),
          u_anamorphicTex: gl.getUniformLocation(programs.composite, "u_anamorphicTex"),
          u_bloomIntensity: gl.getUniformLocation(programs.composite, "u_bloomIntensity"),
          u_time: gl.getUniformLocation(programs.composite, "u_time"),
          u_decodeHDR: gl.getUniformLocation(programs.composite, "u_decodeHDR")
        };

        quadVbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW
        );

        rebuildFbos();
        return true;
      }

      function drawQuad(attrLoc) {
        gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
        gl.enableVertexAttribArray(attrLoc);
        gl.vertexAttribPointer(attrLoc, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      function runBlurPass(srcFbo, dstFbo, dirX, dirY) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo.fbo);
        gl.viewport(0, 0, dstFbo.width, dstFbo.height);
        gl.useProgram(programs.blur);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, srcFbo.tex);
        gl.uniform1i(programs.blurLoc.u_tex, 0);
        gl.uniform2f(programs.blurLoc.u_direction, dirX / srcFbo.width, dirY / srcFbo.height);
        gl.uniform1f(programs.blurLoc.u_decodeHDR, useHDREncode ? 1.0 : 0.0);

        drawQuad(programs.blurLoc.a_pos);
      }

      /* =======================================================================
         5. CAMERA BASIS, AUTO-DRS & MULTIPASS RENDER LOOP
         ======================================================================= */
      function normalize3(v) {
        const len = Math.hypot(v[0], v[1], v[2]) || 1.0;
        return [v[0] / len, v[1] / len, v[2] / len];
      }

      function cross3(a, b) {
        return [
          a[1] * b[2] - a[2] * b[1],
          a[2] * b[0] - a[0] * b[2],
          a[0] * b[1] - a[1] * b[0]
        ];
      }

      function computeCameraBasis() {
        const aspect = canvas.width / Math.max(canvas.height, 1);
        const portraitBoost = aspect < 1.0 ? Math.min(1.0 / Math.max(aspect, 0.50), 1.65) : 1.0;
        const effectiveDist = Math.min(38.0, state.distance * (1.0 + (portraitBoost - 1.0) * 0.44));

        // Gentle breathing drift when Auto-Orbit is enabled
        const driftYawOffset = state.autoDrift ? Math.sin(state.driftPhase * 0.25) * 0.018 : 0.0;
        const driftPitchOffset = state.autoDrift ? Math.sin(state.driftPhase * 0.38) * 0.004 : 0.0;

        const yaw = state.yaw + driftYawOffset;
        const pitch = Math.max(-1.44, Math.min(1.44, state.pitch + driftPitchOffset));

        const cosP = Math.cos(pitch);
        const camPos = [
          effectiveDist * cosP * Math.sin(yaw),
          effectiveDist * Math.sin(pitch),
          effectiveDist * cosP * Math.cos(yaw)
        ];

        const forward = normalize3([-camPos[0], -camPos[1], -camPos[2]]);
        const worldUp = [0.0, 1.0, 0.0];
        let right = cross3(forward, worldUp);
        if (Math.hypot(right[0], right[1], right[2]) < 1e-4) {
          right = [1.0, 0.0, 0.0];
        } else {
          right = normalize3(right);
        }
        const up = normalize3(cross3(right, forward));

        // Positive roll tilts the disk lower-left to upper-right (Interstellar framing)
        const c = Math.cos(state.rollRad);
        const s = Math.sin(state.rollRad);
        const rolledRight = [
          right[0] * c - up[0] * s,
          right[1] * c - up[1] * s,
          right[2] * c - up[2] * s
        ];
        const rolledUp = [
          right[0] * s + up[0] * c,
          right[1] * s + up[1] * c,
          right[2] * s + up[2] * c
        ];

        return {
          pos: camPos,
          right: rolledRight,
          up: rolledUp,
          forward: forward,
          // 32-degree telephoto vertical FOV frames Gargantua's majestic wings & shadow proportions
          fovScale: Math.tan((32.0 * Math.PI / 180.0) * 0.5)
        };
      }

      function updatePerformanceMonitor(rawDt) {
        state.fpsAccumTime += rawDt;
        state.fpsFrameCount++;
        if (state.drsCooldown > 0) {
          state.drsCooldown -= rawDt;
        }

        if (state.fpsAccumTime >= 0.55) {
          const avgFps = state.fpsFrameCount / state.fpsAccumTime;
          state.currentFps = Math.round(avgFps);
          if (fpsBadgeEl) {
            fpsBadgeEl.textContent = state.currentFps + " FPS";
          }

          if (state.autoDrs && fboMode !== "direct" && state.drsCooldown <= 0) {
            if (avgFps < 45 && state.drsScale > 0.56) {
              state.drsScale = Math.max(0.56, +(state.drsScale - 0.08).toFixed(2));
              state.drsCooldown = 1.6;
              rebuildFbos();
            } else if (avgFps > 56 && state.drsScale < 1.0) {
              state.drsScale = Math.min(1.0, +(state.drsScale + 0.05).toFixed(2));
              state.drsCooldown = 2.6;
              rebuildFbos();
            }
          }

          state.fpsAccumTime = 0;
          state.fpsFrameCount = 0;
        }
      }

      function renderFrame(nowMs) {
        if (document.hidden) {
          rafId = null;
          return;
        }
        rafId = requestAnimationFrame(renderFrame);

        if (canvas.width < 1 || canvas.height < 1) {
          rebuildFbos();
        }

        if (!state.lastFrameMs) state.lastFrameMs = nowMs;
        const rawDt = Math.max(0.001, (nowMs - state.lastFrameMs) * 0.001);
        const dt = Math.min(rawDt, 0.05);
        state.lastFrameMs = nowMs;

        updatePerformanceMonitor(Math.min(rawDt, 0.25));
        state.elapsed += dt;
        // Accumulate disk flow time smoothly so speed changes never jump phase (1.8x default)
        state.diskElapsed += dt * state.diskSpeed;

        if (state.autoDrift && !state.isDragging) {
          state.driftPhase += dt;
          state.targetYaw += dt * 0.022;
        }

        const damp = 1.0 - Math.exp(-dt * 8.0);
        state.yaw += (state.targetYaw - state.yaw) * damp;
        state.pitch += (state.targetPitch - state.pitch) * damp;
        state.distance += (state.targetDistance - state.distance) * damp;
        const targetRollRad = state.rollDeg * Math.PI / 180.0;
        state.rollRad += (targetRollRad - state.rollRad) * damp;

        const cam = computeCameraBasis();
        const preset = QUALITY_PRESETS[state.quality] || QUALITY_PRESETS.balanced;
        const hdrFlag = useHDREncode ? 1.0 : 0.0;
        const isDirect = (fboMode === "direct" || !fbos.scene);

        // -------------------------------------------------------------------
        // PASS 1: Binet RK4 Geodesic Black Hole Raytracer
        // -------------------------------------------------------------------
        if (isDirect) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, canvas.width, canvas.height);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.scene.fbo);
          gl.viewport(0, 0, fbos.scene.width, fbos.scene.height);
        }

        gl.useProgram(programs.blackhole);
        const bh = programs.bhLoc;

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, noiseTex);
        gl.uniform1i(bh.u_noiseTex, 0);

        gl.uniform2f(
          bh.u_resolution,
          isDirect ? canvas.width : fbos.scene.width,
          isDirect ? canvas.height : fbos.scene.height
        );
        gl.uniform1f(bh.u_time, state.diskElapsed);
        gl.uniform3f(bh.u_camPos, cam.pos[0], cam.pos[1], cam.pos[2]);
        gl.uniform3f(bh.u_camRight, cam.right[0], cam.right[1], cam.right[2]);
        gl.uniform3f(bh.u_camUp, cam.up[0], cam.up[1], cam.up[2]);
        gl.uniform3f(bh.u_camForward, cam.forward[0], cam.forward[1], cam.forward[2]);
        gl.uniform1f(bh.u_fovScale, cam.fovScale);
        gl.uniform1f(bh.u_diskSpeed, 1.0);
        gl.uniform1f(bh.u_maxSteps, preset.maxSteps);
        gl.uniform1f(bh.u_stepScale, preset.stepScale);
        gl.uniform1f(bh.u_encodeHDR, hdrFlag);
        gl.uniform1f(bh.u_directOutput, isDirect ? 1.0 : 0.0);

        drawQuad(bh.a_pos);

        if (isDirect) {
          return;
        }

        // -------------------------------------------------------------------
        // PASS 2: 1/4-Res Bright-Pass Extraction (Threshold = 0.95)
        // -------------------------------------------------------------------
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.bright.fbo);
        gl.viewport(0, 0, fbos.bright.width, fbos.bright.height);
        gl.useProgram(programs.bright);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, fbos.scene.tex);
        gl.uniform1i(programs.brightLoc.u_tex, 0);
        gl.uniform2f(programs.brightLoc.u_texelSize, 1.5 / fbos.scene.width, 1.5 / fbos.scene.height);
        gl.uniform1f(programs.brightLoc.u_decodeHDR, hdrFlag);

        drawQuad(programs.brightLoc.a_pos);

        // -------------------------------------------------------------------
        // PASS 3 & 4: Tier 1 Tight Bloom (1/4 res)
        // -------------------------------------------------------------------
        runBlurPass(fbos.bright, fbos.tightPing, 1.15, 0.0);
        runBlurPass(fbos.tightPing, fbos.tightPong, 0.0, 1.15);

        // -------------------------------------------------------------------
        // PASS 5 & 6: Tier 2 Mid Bloom (1/8 res)
        // -------------------------------------------------------------------
        runBlurPass(fbos.tightPong, fbos.midPing, 1.55, 0.0);
        runBlurPass(fbos.midPing, fbos.midPong, 0.0, 1.55);

        // -------------------------------------------------------------------
        // PASS 7 & 8: Tier 3 Wide IMAX Halation (1/16 res)
        // -------------------------------------------------------------------
        runBlurPass(fbos.midPong, fbos.widePing, 1.85, 0.0);
        runBlurPass(fbos.widePing, fbos.widePong, 0.0, 1.85);

        // -------------------------------------------------------------------
        // PASS 9: Subtle Anamorphic Flare aligned near disk axis (1/8 res)
        // -------------------------------------------------------------------
        const streakAngle = state.rollRad * 0.45;
        const sx = Math.cos(streakAngle);
        const sy = Math.sin(streakAngle);
        runBlurPass(fbos.bright, fbos.anamPing, sx * 2.4, sy * 2.4);
        runBlurPass(fbos.anamPing, fbos.anamPong, sx * 4.6, sy * 4.6);

        // -------------------------------------------------------------------
        // PASS 10: Final Composite (ACES Filmic + 3-Tier Bloom + 70mm Grain)
        // -------------------------------------------------------------------
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(programs.composite);

        const cp = programs.compLoc;
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, fbos.scene.tex);
        gl.uniform1i(cp.u_sceneTex, 0);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, fbos.tightPong.tex);
        gl.uniform1i(cp.u_bloomTightTex, 1);

        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, fbos.midPong.tex);
        gl.uniform1i(cp.u_bloomMidTex, 2);

        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, fbos.widePong.tex);
        gl.uniform1i(cp.u_bloomWideTex, 3);

        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, fbos.anamPong.tex);
        gl.uniform1i(cp.u_anamorphicTex, 4);

        gl.uniform1f(cp.u_bloomIntensity, state.bloomIntensity);
        gl.uniform1f(cp.u_time, state.elapsed);
        gl.uniform1f(cp.u_decodeHDR, hdrFlag);

        drawQuad(cp.a_pos);
      }

      function startLoop() {
        if (!rafId && !document.hidden) {
          state.lastFrameMs = 0;
          state.fpsAccumTime = 0;
          state.fpsFrameCount = 0;
          rafId = requestAnimationFrame(renderFrame);
        }
      }

      function stopLoop() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      /* =======================================================================
         6. MOUSE / TOUCH ORBIT INTERACTIONS & MINIMAL UI CONTROLS
         ======================================================================= */
      function clampPitch(p) {
        return Math.max(-1.42, Math.min(1.42, p));
      }

      function clampDist(d) {
        return Math.max(12.0, Math.min(38.0, d));
      }

      function syncElevationUI() {
        const elSlider = document.getElementById("elevationSlider");
        const elVal = document.getElementById("elevationVal");
        if (!elSlider || !elVal) return;
        const deg = state.targetPitch * 180.0 / Math.PI;
        elSlider.value = Math.max(0, Math.min(30, deg)).toFixed(1);
        elVal.textContent = deg.toFixed(1) + "°";
      }

      function setupCanvasInteractions() {
        canvas.addEventListener("mousedown", function (e) {
          if (e.button !== 0) return;
          state.isDragging = true;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;
        });

        window.addEventListener("mousemove", function (e) {
          if (!state.isDragging) return;
          const dx = e.clientX - state.lastPointerX;
          const dy = e.clientY - state.lastPointerY;
          state.lastPointerX = e.clientX;
          state.lastPointerY = e.clientY;

          state.targetYaw -= dx * 0.0052;
          state.targetPitch = clampPitch(state.targetPitch + dy * 0.0048);
          syncElevationUI();
        });

        window.addEventListener("mouseup", function () {
          state.isDragging = false;
        });

        canvas.addEventListener("wheel", function (e) {
          e.preventDefault();
          const zoomDelta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 120) * 0.024;
          state.targetDistance = clampDist(state.targetDistance + zoomDelta);
        }, { passive: false });

        canvas.addEventListener("touchstart", function (e) {
          if (e.touches.length === 1) {
            state.isDragging = true;
            state.lastPointerX = e.touches[0].clientX;
            state.lastPointerY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            state.isDragging = false;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            state.pinchStartDist = Math.hypot(dx, dy);
            state.pinchStartCamDist = state.targetDistance;
          }
        }, { passive: true });

        canvas.addEventListener("touchmove", function (e) {
          e.preventDefault();
          if (e.touches.length === 1 && state.isDragging) {
            const dx = e.touches[0].clientX - state.lastPointerX;
            const dy = e.touches[0].clientY - state.lastPointerY;
            state.lastPointerX = e.touches[0].clientX;
            state.lastPointerY = e.touches[0].clientY;

            state.targetYaw -= dx * 0.0062;
            state.targetPitch = clampPitch(state.targetPitch + dy * 0.0056);
            syncElevationUI();
          } else if (e.touches.length === 2 && state.pinchStartDist > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const curDist = Math.hypot(dx, dy);
            const ratio = state.pinchStartDist / Math.max(curDist, 10);
            state.targetDistance = clampDist(state.pinchStartCamDist * ratio);
          }
        }, { passive: false });

        canvas.addEventListener("touchend", function (e) {
          if (e.touches.length === 0) {
            state.isDragging = false;
            state.pinchStartDist = 0;
          } else if (e.touches.length === 1) {
            state.isDragging = true;
            state.lastPointerX = e.touches[0].clientX;
            state.lastPointerY = e.touches[0].clientY;
            state.pinchStartDist = 0;
          }
        }, { passive: true });
      }

      function setupUIControls() {
        const uiRoot = document.getElementById("uiRoot");
        const toggleBtn = document.getElementById("settingsToggle");
        const panel = document.getElementById("settingsPanel");

        const elevationSlider = document.getElementById("elevationSlider");
        const elevationVal = document.getElementById("elevationVal");
        const edgeOnBtn = document.getElementById("edgeOnBtn");
        const rollSlider = document.getElementById("rollSlider");
        const rollVal = document.getElementById("rollVal");
        const speedSlider = document.getElementById("speedSlider");
        const speedVal = document.getElementById("speedVal");
        const bloomSlider = document.getElementById("bloomSlider");
        const bloomVal = document.getElementById("bloomVal");
        const driftToggle = document.getElementById("driftToggle");
        const drsToggle = document.getElementById("drsToggle");
        const resetCameraBtn = document.getElementById("resetCameraBtn");
        const qualityBtns = document.querySelectorAll(".quality-btn");

        function setPanelOpen(open) {
          state.panelOpen = open;
          panel.classList.toggle("open", open);
          toggleBtn.classList.toggle("active", open);
          toggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
        }

        toggleBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          setPanelOpen(!state.panelOpen);
        });

        canvas.addEventListener("pointerdown", function () {
          if (state.panelOpen) {
            setPanelOpen(false);
          }
        });

        elevationSlider.addEventListener("input", function () {
          const deg = parseFloat(elevationSlider.value);
          state.targetPitch = deg * Math.PI / 180.0;
          elevationVal.textContent = deg.toFixed(1) + "°";
        });

        if (edgeOnBtn) {
          edgeOnBtn.addEventListener("click", function () {
            state.targetPitch = 0.0;
            elevationSlider.value = "0";
            elevationVal.textContent = "0.0°";
          });
        }

        rollSlider.addEventListener("input", function () {
          state.rollDeg = parseFloat(rollSlider.value);
          rollVal.textContent = state.rollDeg.toFixed(1) + "°";
        });

        speedSlider.addEventListener("input", function () {
          state.diskSpeed = parseFloat(speedSlider.value);
          speedVal.textContent = state.diskSpeed.toFixed(2) + "x";
        });

        bloomSlider.addEventListener("input", function () {
          state.bloomIntensity = parseFloat(bloomSlider.value);
          bloomVal.textContent = state.bloomIntensity.toFixed(2);
        });

        driftToggle.addEventListener("change", function () {
          state.autoDrift = driftToggle.checked;
        });

        drsToggle.addEventListener("change", function () {
          state.autoDrs = drsToggle.checked;
          if (!state.autoDrs && state.drsScale !== 1.0) {
            state.drsScale = 1.0;
            rebuildFbos();
          }
        });

        qualityBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            const q = btn.getAttribute("data-quality");
            if (!QUALITY_PRESETS[q] || q === state.quality) return;
            state.quality = q;
            state.drsScale = 1.0;
            state.drsCooldown = 1.6;
            qualityBtns.forEach(function (b) {
              b.classList.toggle("active", b === btn);
            });
            rebuildFbos();
          });
        });

        resetCameraBtn.addEventListener("click", function () {
          state.targetYaw = DEFAULT_CAMERA.yaw;
          state.targetPitch = DEFAULT_CAMERA.pitch;
          state.targetDistance = DEFAULT_CAMERA.distance;
          state.rollDeg = DEFAULT_CAMERA.rollDeg;
          elevationSlider.value = String(DEFAULT_CAMERA.elevationDeg);
          elevationVal.textContent = DEFAULT_CAMERA.elevationDeg.toFixed(1) + "°";
          rollSlider.value = String(DEFAULT_CAMERA.rollDeg);
          rollVal.textContent = DEFAULT_CAMERA.rollDeg.toFixed(1) + "°";
        });

        window.addEventListener("keydown", function (e) {
          if (e.key === "h" || e.key === "H") {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
              return;
            }
            state.uiHidden = !state.uiHidden;
            uiRoot.classList.toggle("ui-hidden", state.uiHidden);
            if (state.uiHidden) {
              setPanelOpen(false);
            }
          } else if (e.key === "Escape" && state.panelOpen) {
            setPanelOpen(false);
          }
        });
      }

      /* =======================================================================
         7. LIFECYCLE & RESIZE MANAGEMENT
         ======================================================================= */
      let resizeTimer = null;
      window.addEventListener("resize", function () {
        if (!gl) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          rebuildFbos();
        }, 120);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          stopLoop();
        } else if (gl) {
          startLoop();
        }
      });

      canvas.addEventListener("webglcontextlost", function (e) {
        e.preventDefault();
        stopLoop();
      }, false);

      canvas.addEventListener("webglcontextrestored", function () {
        if (initWebGL()) {
          startLoop();
        }
      }, false);

      window.onload = function () {
        try {
          if (!initWebGL()) return;
          setupCanvasInteractions();
          setupUIControls();
          startLoop();
        } catch (err) {
          showDiagnosticError(
            "起動処理中に予期しないエラーが発生しました。",
            err && err.stack ? err.stack : String(err)
          );
        }
      };
    })();
  </script>
</body>
</html>
