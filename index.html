<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gargantua — Real-Time Black Hole</title>
  <style>
    /* =========================================================================
       Base Reset & Full-Viewport Pitch-Black Cosmos Layout
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030202;
      color: #fff5e8;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #glcanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      background-color: #030202;
    }

    #glcanvas:active {
      cursor: grabbing;
    }

    /* =========================================================================
       Minimal Corner Toggle & Slim Dark-Glass Control Panel
       ========================================================================= */
    .ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ui-root.ui-hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    .ui-root.ui-hidden * {
      pointer-events: none !important;
    }

    .settings-toggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(242, 204, 166, 0.16);
      background: rgba(14, 10, 8, 0.46);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 245, 232, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      opacity: 0.24;
      transition:
        opacity 0.3s ease,
        transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.26s ease,
        background-color 0.26s ease,
        box-shadow 0.26s ease;
    }

    .settings-toggle:hover,
    .settings-toggle:focus-visible,
    .settings-toggle.active {
      opacity: 0.94;
      border-color: rgba(242, 204, 166, 0.48);
      background: rgba(20, 14, 10, 0.78);
      box-shadow: 0 0 22px rgba(198, 130, 78, 0.26);
      outline: none;
    }

    .settings-toggle:active {
      transform: scale(0.94);
    }

    .settings-toggle svg {
      width: 18px;
      height: 18px;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .settings-toggle.active svg {
      transform: rotate(45deg);
    }

    .settings-panel {
      position: fixed;
      right: 20px;
      bottom: 76px;
      width: min(308px, calc(100vw - 40px));
      max-height: calc(100vh - 104px);
      overflow-y: auto;
      padding: 18px 18px 14px;
      border-radius: 16px;
      border: 1px solid rgba(242, 204, 166, 0.14);
      background: rgba(12, 9, 7, 0.76);
      backdrop-filter: blur(22px) saturate(118%);
      -webkit-backdrop-filter: blur(22px) saturate(118%);
      box-shadow:
        0 20px 52px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 245, 232, 0.08);
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px) scale(0.97);
      transform-origin: bottom right;
      transition:
        opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .settings-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(242, 204, 166, 0.1);
    }

    .panel-title {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: rgba(255, 245, 232, 0.92);
      text-transform: uppercase;
    }

    .fps-badge {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(242, 204, 166, 0.24);
      background: rgba(198, 130, 78, 0.18);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #fff5e8;
    }

    .control-group {
      margin-bottom: 13px;
    }

    .control-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11.5px;
      color: rgba(246, 232, 218, 0.86);
    }

    .control-value {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      color: #f2cca6;
    }

    .control-value-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn {
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(242, 204, 166, 0.28);
      background: rgba(198, 130, 78, 0.16);
      color: #fff5e8;
      font-size: 9.5px;
      font-family: inherit;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip-btn:hover {
      background: rgba(198, 130, 78, 0.36);
      border-color: rgba(242, 204, 166, 0.62);
      color: #ffffff;
    }

    .chip-btn:active {
      transform: scale(0.95);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(242, 204, 166, 0.16);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f2cca6 62%, #c6824e 100%);
      border: 1px solid rgba(255, 245, 232, 0.86);
      box-shadow: 0 0 10px rgba(242, 204, 166, 0.48);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.14);
      box-shadow: 0 0 14px rgba(255, 245, 232, 0.78);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f2cca6 62%, #c6824e 100%);
      border: 1px solid rgba(255, 245, 232, 0.86);
      box-shadow: 0 0 10px rgba(242, 204, 166, 0.48);
      cursor: pointer;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 2px 0;
    }

    .toggle-row span {
      font-size: 11.5px;
      color: rgba(246, 232, 218, 0.86);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 21px;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(242, 204, 166, 0.14);
      border: 1px solid rgba(242, 204, 166, 0.18);
      transition: background-color 0.24s ease, border-color 0.24s ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: rgba(242, 204, 166, 0.72);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.24s ease;
    }

    .switch input:checked + .switch-track {
      background: rgba(198, 130, 78, 0.48);
      border-color: rgba(242, 204, 166, 0.58);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(17px);
      background: #fff5e8;
      box-shadow: 0 0 8px rgba(242, 204, 166, 0.65);
    }

    .quality-segment {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .quality-btn {
      padding: 7px 4px;
      border-radius: 9px;
      border: 1px solid rgba(242, 204, 166, 0.14);
      background: rgba(242, 204, 166, 0.04);
      color: rgba(246, 232, 218, 0.74);
      font-size: 10.5px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quality-btn:hover {
      background: rgba(242, 204, 166, 0.12);
      color: #fff5e8;
    }

    .quality-btn.active {
      background: rgba(198, 130, 78, 0.34);
      border-color: rgba(242, 204, 166, 0.58);
      color: #ffffff;
      font-weight: 600;
      box-shadow: inset 0 0 12px rgba(242, 204, 166, 0.2);
    }

    .reset-btn {
      width: 100%;
      margin-top: 4px;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid rgba(242, 204, 166, 0.18);
      background: rgba(242, 204, 166, 0.07);
      color: rgba(255, 245, 232, 0.92);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: rgba(198, 130, 78, 0.24);
      border-color: rgba(242, 204, 166, 0.42);
      color: #ffffff;
    }

    .reset-btn:active {
      transform: scale(0.98);
    }

    .panel-hint {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px solid rgba(242, 204, 166, 0.08);
      font-size: 10px;
      line-height: 1.55;
      color: rgba(242, 204, 166, 0.5);
      text-align: center;
    }

    .panel-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(242, 204, 166, 0.24);
      background: rgba(242, 204, 166, 0.08);
      color: rgba(255, 245, 232, 0.88);
      font-family: inherit;
      font-size: 9.5px;
    }

    /* =========================================================================
       Diagnostic Error Overlay (Only Shown if WebGL Initialization Fails)
       ========================================================================= */
    .error-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(5, 4, 4, 0.94);
      z-index: 100;
    }

    .error-card {
      width: min(560px, 100%);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(242, 204, 166, 0.35);
      background: rgba(20, 14, 11, 0.96);
      color: #fff5e8;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.86);
    }

    .error-card h2 {
      font-size: 15px;
      margin-bottom: 10px;
      color: #f2cca6;
    }

    .error-card p {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(246, 232, 218, 0.86);
      margin-bottom: 12px;
    }

    .error-log {
      max-height: 220px;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(242, 204, 166, 0.16);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #f2cca6;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" aria-label="Gargantua Black Hole Visualization"></canvas>

  <!-- Minimal UI Layer: single subtle bottom-right toggle icon on launch -->
  <div id="uiRoot" class="ui-root">
    <button
      id="settingsToggle"
      class="settings-toggle"
      type="button"
      aria-label="設定パネルを開く"
      aria-expanded="false"
      title="設定 (HキーでUI非表示)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <aside id="settingsPanel" class="settings-panel" aria-label="ブラックホール設定">
      <div class="panel-header">
        <span class="panel-title">Gargantua</span>
        <span id="fpsBadge" class="fps-badge">60 FPS</span>
      </div>

      <div class="control-group">
        <div class="control-label-row">
          <span>画質プリセット</span>
          <span id="scaleVal" class="control-value">75%</span>
        </div>
        <div class="quality-segment" role="group" aria-label="画質プリセット">
          <button type="button" class="quality-btn" data-quality="eco">軽量 (0.5x)</button>
          <button type="button" class="quality-btn active" data-quality="balanced">バランス (0.75x)</button>
          <button type="button" class="quality-btn" data-quality="high">高品質 (1.0x)</button>
        </div>
      </div>

      <div class="toggle-row">
        <span>Auto-DRS (自動解像度調整)</span>
        <label class="switch" aria-label="自動解像度調整の切り替え">
          <input id="drsToggle" type="checkbox" checked />
          <span class="switch-track"></span>
        </label>
      </div>

      <div class="control-group">
        <div class="control-label-row">
          <label for="elevationSlider">カメラ仰角</label>
          <div class="control-value-group">
            <button id="edgeOnBtn" class="chip-btn" type="button" title="仰角を0°（完全な真横）に設定">0°真横</button>
            <span id="elevationVal" class="control-value">7.0°</span>
          </div>
        </div>
        <input id="elevationSlider" type="range" min="0" max="30" step="0.5" value="7.0" />
      </div>

      <div class="control-group">
        <div class="control-label-row">
          <label for="rollSlider">傾き角度</label>
          <span id="rollVal" class="control-value">17.5°</span>
        </div>
        <input id="rollSlider" type="range" min="-45" max="45" step="0.5" value="17.5" />
      </div>

      <div class="control-group">
        <div class="control-label-row">
          <label for="speedSlider">回転速度</label>
          <span id="speedVal" class="control-value">1.80x</span>
        </div>
        <input id="speedSlider" type="range" min="0" max="4" step="0.05" value="1.8" />
      </div>

      <div class="control-group">
        <div class="control-label-row">
          <label for="bloomSlider">ブルーム強度</label>
          <span id="bloomVal" class="control-value">1.00</span>
        </div>
        <input id="bloomSlider" type="range" min="0" max="2" step="0.05" value="1.0" />
      </div>

      <div class="toggle-row">
        <span>自動カメラ</span>
        <label class="switch" aria-label="自動カメラの切り替え">
          <input id="driftToggle" type="checkbox" />
          <span class="switch-track"></span>
        </label>
      </div>

      <button id="resetCameraBtn" class="reset-btn" type="button">視点リセット</button>

      <div class="panel-hint">
        ドラッグで360°回転・ホイールで拡大縮小<br />
        <kbd>H</kbd> キーでUIを完全に非表示
      </div>
    </aside>
  </div>

  <!-- Diagnostic Error Overlay -->
  <div id="errorOverlay" class="error-overlay" role="alert">
    <div class="error-card">
      <h2>WebGL 初期化・描画エラー</h2>
      <p id="errorMessage">WebGL コンテキストの初期化またはシェーダーのコンパイルに失敗しました。</p>
      <pre id="errorLog" class="error-log"></pre>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* =======================================================================
         1. STRICT GLSL ES 1.00 SHADERS (Exact Schwarzschild Binet RK4 Engine)
         ======================================================================= */

      /**
       * Fullscreen quad vertex shader.
       */
      const VERT_QUAD = [
        "attribute vec2 a_pos;",
        "varying vec2 v_uv;",
        "void main() {",
        "  v_uv = a_pos * 0.5 + 0.5;",
        "  gl_Position = vec4(a_pos, 0.0, 1.0);",
        "}"
      ].join("\n");

      /**
       * PASS 1: Singularity-Free 3D Cartesian Schwarzschild Geodesic Raytracer (Velocity Verlet)
       *
       * Mathematical & Visual Highlights:
       *  - Exact Schwarzschild null geodesic acceleration: a(p) = -1.5 * h^2 * p / r^5
       *    where h^2 = |ro x rd|^2 is strictly conserved along the entire trajectory.
       *  - As impact parameter b -> 0, h^2 -> 0 smoothly, so rays aimed dead-center move in a
       *    completely singularity-free straight line through the foreground disk: 0% bullseye / pinch.
       *  - Velocity Verlet symplectic integration (1 accel eval/step) with adaptive dt & first-step
       *    Interleaved Gradient Noise (IGN) jitter eliminates all slice banding & vertical stripes.
       *  - Hybrid Accretion Disk (R_IN = 2.32 .. R_OUT = 15.2): seamlessly blends an exact y = 0
       *    equatorial filament intersection with a thin volumetric plasma layer H(r) = 0.065 + 0.018*(r-R_IN)
       *    using abs(rayDir.y) so both 0-deg edge-on and 7-deg Gargantua framing render flawlessly.
       *  - Razor-thin 1.0-1.8px ivory-white Photon Ring occluded cleanly by foreground disk transmittance.
       */
      const FRAG_BLACKHOLE = [
        "#ifdef GL_FRAGMENT_PRECISION_HIGH",
        "precision highp float;",
        "#else",
        "precision mediump float;",
        "#endif",
        "",
        "varying vec2 v_uv;",
        "",
        "uniform sampler2D u_noiseTex;",
        "uniform vec2 u_resolution;",
        "uniform float u_time;",
        "uniform vec3 u_camPos;",
        "uniform vec3 u_camRight;",
        "uniform vec3 u_camUp;",
        "uniform vec3 u_camForward;",
        "uniform float u_fovScale;",
        "uniform float u_diskSpeed;",
        "uniform float u_maxSteps;",
        "uniform float u_stepScale;",
        "uniform float u_encodeHDR;",
        "uniform float u_directOutput;",
        "",
        "const float PI = 3.14159265359;",
        "const float TWO_PI = 6.28318530718;",
        "const float R_HORIZON = 1.008;",
        "const float R_ESCAPE = 32.0;",
        "const float R_IN = 2.32;",
        "const float R_OUT = 15.2;",
        "const int MAX_STEPS = 120;",
        "",
        "// ---------------------------------------------------------------------",
        "// Deterministic 3D Cell Hashes for Refined Deep-Space Starfield",
        "// ---------------------------------------------------------------------",
        "float hash13(vec3 p3) {",
        "  p3 = fract(p3 * 0.1031);",
        "  p3 += dot(p3, p3.zyx + 31.32);",
        "  return fract((p3.x + p3.y) * p3.z);",
        "}",
        "",
        "vec3 hash33(vec3 p3) {",
        "  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));",
        "  p3 += dot(p3, p3.yxz + 33.33);",
        "  return fract((p3.xxy + p3.yxx) * p3.zyx);",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Interstellar Champagne-Bronze & Pearl-White Palette (Linear RGB)",
        "// Zero yellow / lemon cast, zero excessive neon orange:",
        "//  #1F0E07 -> #5A2E16 -> #A86438 -> #D89C68 -> #F5DFC4 -> #FFF8EE",
        "// ---------------------------------------------------------------------",
        "vec3 gargantuaPalette(float t) {",
        "  float x = clamp(t, 0.0, 2.2);",
        "  vec3 c0 = vec3(0.010, 0.0022, 0.0006);",
        "  vec3 c1 = vec3(0.102, 0.0260, 0.0065);",
        "  vec3 c2 = vec3(0.395, 0.1280, 0.0390);",
        "  vec3 c3 = vec3(0.692, 0.3380, 0.1400);",
        "  vec3 c4 = vec3(0.916, 0.7450, 0.5600);",
        "  vec3 c5 = vec3(1.000, 0.9410, 0.8580);",
        "",
        "  vec3 col = mix(c0, c1, smoothstep(0.00, 0.24, x));",
        "  col = mix(col, c2, smoothstep(0.20, 0.54, x));",
        "  col = mix(col, c3, smoothstep(0.50, 0.88, x));",
        "  col = mix(col, c4, smoothstep(0.84, 1.28, x));",
        "  col = mix(col, c5, smoothstep(1.22, 1.78, x));",
        "  return col;",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Subtle, Dignified Gravitationally-Lensed Deep Space Backdrop (#030201)",
        "// Only evaluated for escaping geodesics (never inside event horizon)",
        "// ---------------------------------------------------------------------",
        "vec3 sampleStarLayer(vec3 dir, float gridScale, float densityPow, float sizeScale, float brightness) {",
        "  vec3 p = dir * gridScale;",
        "  vec3 cell = floor(p);",
        "  vec3 local = fract(p);",
        "",
        "  vec3 rnd = hash33(cell);",
        "  vec3 center = 0.24 + 0.52 * rnd;",
        "  vec3 diff = local - center;",
        "  float d2 = dot(diff, diff);",
        "",
        "  float prob = hash13(cell + vec3(19.13, 7.41, 3.89));",
        "  float spark = pow(max(prob, 0.0001), densityPow);",
        "",
        "  float rad = (0.022 + 0.034 * rnd.x) * sizeScale;",
        "  float invRad2 = 1.0 / max(rad * rad * 0.24, 0.0001);",
        "  float core = exp(-d2 * invRad2);",
        "",
        "  vec3 tint = mix(vec3(0.92, 0.94, 1.00), vec3(1.00, 0.95, 0.89), rnd.y);",
        "  tint = mix(tint, vec3(0.94, 0.78, 0.64), step(0.86, rnd.z) * 0.35);",
        "  return tint * core * spark * brightness;",
        "}",
        "",
        "vec3 sampleSpaceBackdrop(vec3 dir) {",
        "  // Deep black with whisper-subtle dark sepia space tone (~#030201)",
        "  vec3 col = vec3(0.00045, 0.00028, 0.00018);",
        "",
        "  // Delicate, sparse pinpoint stars that bend gracefully into arcs",
        "  col += sampleStarLayer(dir, 58.0,  8.0, 0.68, 0.82);",
        "  col += sampleStarLayer(dir, 126.0, 8.6, 0.60, 0.45);",
        "  col += sampleStarLayer(dir, 224.0, 9.2, 0.56, 0.22);",
        "",
        "  // Barely perceptible warm cosmic dust whisper",
        "  float band = exp(-abs(dir.y * 1.35 + dir.x * 0.22) * 3.4);",
        "  vec2 nebUv = dir.xz * 0.34 + vec2(dir.y * 0.22 + 0.17, -dir.y * 0.18 + 0.53);",
        "  vec4 neb = texture2D(u_noiseTex, nebUv);",
        "  float dust = band * smoothstep(0.46, 0.90, neb.r) * (0.45 + 0.55 * neb.g);",
        "  col += vec3(0.0038, 0.0020, 0.0011) * dust;",
        "  return col;",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Sleek Thin Accretion Disk Half-Thickness H(r)",
        "// H(r) = 0.065 + 0.018 * (r - R_IN), gracefully tapered at inner & outer rims",
        "// ---------------------------------------------------------------------",
        "float diskHalfHeight(float r) {",
        "  float rOff = max(r - R_IN, 0.0);",
        "  float baseH = 0.065 + 0.018 * rOff;",
        "  float innerTaper = smoothstep(R_IN - 0.08, R_IN + 0.55, r);",
        "  float outerTaper = 1.0 - 0.42 * smoothstep(10.5, R_OUT, r);",
        "  return max(baseH * (0.45 + 0.55 * innerTaper) * outerTaper, 0.012);",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Mipmap-Safe & Branch-Seam-Free Polar LUT Sampling",
        "// Strictly uses integer angular multipliers (1.0, 2.0, 3.0) so +/-PI wraps",
        "// identically on gl.REPEAT with zero derivative spike across the cut.",
        "// ---------------------------------------------------------------------",
        "vec4 samplePolarSeamless(",
        "  float uA,",
        "  float uB,",
        "  float wSeam,",
        "  float intFreq,",
        "  float uOffset,",
        "  float vCoord",
        ") {",
        "  vec4 sA = texture2D(u_noiseTex, vec2(uA * intFreq + uOffset, vCoord));",
        "  vec4 sB = texture2D(u_noiseTex, vec2((uB + 0.5) * intFreq + uOffset, vCoord));",
        "  return mix(sA, sB, wSeam);",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Core Relativistic Accretion Disk Evaluation (Shared by Equatorial & Volume)",
        "//  - Integer-harmonic concentric/spiral silk streaks (zero vertical stripes)",
        "//  - Logarithmic spiral shear (+0.55 * log(r)) + Keplerian differential spin",
        "//  - Rich foreground dust occlusion + delicate highlight structure",
        "//  - Balanced Interstellar Doppler beaming (~1.30x left, ~0.78x right)",
        "// ---------------------------------------------------------------------",
        "void evaluateDiskProperties(",
        "  vec3 p,",
        "  vec3 rayDir,",
        "  float r,",
        "  float yNorm,",
        "  out vec3 emission,",
        "  out float absorption",
        ") {",
        "  emission = vec3(0.0);",
        "  absorption = 0.0;",
        "",
        "  if (r < R_IN - 0.10 || r > R_OUT + 0.25) return;",
        "",
        "  float rNorm = clamp((r - R_IN) / max(R_OUT - R_IN, 0.001), 0.0, 1.0);",
        "  float innerEdge = smoothstep(R_IN - 0.05, R_IN + 0.36, r);",
        "  float outerFade = pow(max(1.0 - rNorm, 0.0001), 1.65);",
        "  float radialEnv = innerEdge * outerFade;",
        "  if (radialEnv <= 0.0004) return;",
        "",
        "  // Seam-free polar angle u in [0, 1] + logarithmic spiral coordinate",
        "  float invR = 1.0 / max(r, 0.001);",
        "  float uA = atan(p.z, p.x) / TWO_PI + 0.5;",
        "  float uB = atan(-p.z, -p.x) / TWO_PI + 0.5;",
        "  float wSeam = smoothstep(-0.22, 0.22, -p.x * invR);",
        "  float logR = log(max(r / R_IN, 0.5));",
        "",
        "  // Keplerian differential angular velocity (faster near ISCO, majestic outside)",
        "  float spd = max(u_diskSpeed, 0.0);",
        "  float rRatio = R_IN * invR;",
        "  float omega = 1.55 * rRatio * sqrt(max(rRatio, 0.0001));",
        "  float baseSpin = -u_time * spd * 0.055;",
        "",
        "  // Dual-phase flow advection keeps high-speed inner differential vortex crisp forever",
        "  float flowFreq = 0.12 * max(spd, 0.001);",
        "  float ph0 = fract(u_time * flowFreq);",
        "  float ph1 = fract(ph0 + 0.5);",
        "  float w0 = sin(ph0 * PI);",
        "  float w1 = sin(ph1 * PI);",
        "  float invW = 1.0 / max(w0 + w1, 0.001);",
        "  w0 *= invW;",
        "  w1 *= invW;",
        "",
        "  float tau0 = ph0 - 0.5;",
        "  float tau1 = ph1 - 0.5;",
        "  float seed0 = mod(floor(u_time * flowFreq), 29.0) * 0.173;",
        "  float seed1 = mod(floor(u_time * flowFreq + 0.5), 29.0) * 0.173;",
        "",
        "  float diffSpin = -(omega - 0.18) * 0.48;",
        "  float spiralShear = 0.55 * logR;",
        "  float inwardPull = 0.26 * sqrt(max(rRatio, 0.0001));",
        "",
        "  // Layer 1 (intFreq = 1.0): Broad sweeping spiral plasma clouds & dark dust bands",
        "  float uOff0 = baseSpin + diffSpin * tau0 + spiralShear + seed0;",
        "  float uOff1 = baseSpin + diffSpin * tau1 + spiralShear + seed1;",
        "  float vMacro0 = 0.145 * (r + tau0 * inwardPull) + 0.03 * yNorm + seed0 * 0.4;",
        "  float vMacro1 = 0.145 * (r + tau1 * inwardPull) + 0.03 * yNorm + seed1 * 0.4;",
        "  vec4 macro0 = samplePolarSeamless(uA, uB, wSeam, 1.0, uOff0, vMacro0);",
        "  vec4 macro1 = samplePolarSeamless(uA, uB, wSeam, 1.0, uOff1, vMacro1);",
        "  vec4 macro = macro0 * w0 + macro1 * w1;",
        "",
        "  // Layer 2 (intFreq = 2.0): Sleek Saturn-ring-like luminous silk filaments",
        "  float uMid = baseSpin * 1.65 + 0.55 * logR + 0.035 * (macro.r - 0.5);",
        "  float vMid = 0.34 * r + 0.09 * macro.g - u_time * spd * 0.012;",
        "  vec4 midTex = samplePolarSeamless(uA, uB, wSeam, 2.0, uMid, vMid);",
        "",
        "  // Layer 3 (intFreq = 3.0): Ultra-fine crisp concentric luminous threads visible even in arches",
        "  float uFine = baseSpin * 2.35 + 0.32 * logR + 0.02 * (midTex.b - 0.5);",
        "  float vFine = 0.72 * r + 0.06 * macro.r;",
        "  vec4 fineTex = samplePolarSeamless(uA, uB, wSeam, 3.0, uFine, vFine);",
        "",
        "  // Combine into crisp concentric-to-spiral luminous ribbons (zero cross-striping)",
        "  float ribbonWave1 = 0.5 + 0.5 * sin(r * 8.6 + 2.1 * macro.r + 1.4 * midTex.b);",
        "  float ribbonWave2 = 0.5 + 0.5 * sin(r * 19.2 + 2.6 * midTex.a + 1.1 * fineTex.a);",
        "  float sharpThreads = pow(max(ribbonWave1, 0.0001), 2.1) * (0.42 + 0.58 * midTex.a);",
        "  float microThreads = pow(max(ribbonWave2, 0.0001), 2.4) * (0.35 + 0.65 * fineTex.a);",
        "",
        "  float clouds = clamp(macro.r * 0.56 + macro.g * 0.30 + midTex.b * 0.14, 0.0, 1.0);",
        "  float silk = clamp(midTex.a * 0.38 + sharpThreads * 0.38 + microThreads * 0.24, 0.0, 1.0);",
        "",
        "  // Ragged wispy outer wing dissolution so the disk fades organically into deep space",
        "  float wingWisps = smoothstep(0.08, 0.66, clouds * 0.64 + silk * 0.56 + (1.0 - rNorm) * 0.42);",
        "  radialEnv *= mix(1.0, wingWisps, smoothstep(0.28, 0.92, rNorm));",
        "",
        "  // Fine dark espresso dust lanes woven through the mid and outer disk",
        "  float dustMask = smoothstep(0.30, 0.80, (1.0 - macro.g) * 0.56 + (1.0 - midTex.b) * 0.44);",
        "  float darkLanes = dustMask * smoothstep(2.9, 8.6, r);",
        "",
        "  // Relativistic Doppler beaming (left side x < 0 approaches camera: ~1.30x bright, right ~0.78x)",
        "  vec3 tangDir = vec3(p.z * invR, 0.0, -p.x * invR);",
        "  float beta = clamp(0.27 * sqrt(max(rRatio, 0.0001)), 0.0, 0.30);",
        "  float doppler = clamp(1.0 + beta * dot(tangDir, -rayDir), 0.78, 1.30);",
        "  float dopplerLum = pow(max(doppler, 0.01), 1.32);",
        "",
        "  // Temperature profile: scorching pearl-ivory inner ring -> champagne bronze -> espresso dust",
        "  float rFromIn = max(r - R_IN, 0.0);",
        "  float innerHeat = exp(-rFromIn * 0.48);",
        "  float midGlow = exp(-max(r - (R_IN + 0.65), 0.0) * 0.21);",
        "  float innerRim = exp(-pow((r - (R_IN + 0.30)) * 1.55, 2.0));",
        "",
        "  // High-contrast filament modulation ensures crisp streaks survive ACES inside bright arches",
        "  float filamentContrast = 0.40 + 0.68 * silk + 0.26 * clouds;",
        "  float temp = (0.14 + 1.05 * innerHeat + 0.46 * innerRim + 0.48 * silk + 0.18 * clouds - 0.36 * darkLanes)",
        "             * (0.84 + 0.24 * doppler);",
        "  vec3 baseCol = gargantuaPalette(temp);",
        "",
        "  // Calibrated HDR intensity: glowing pearl-ivory without flat blown-out white banding",
        "  float structure = filamentContrast * (1.0 - 0.56 * darkLanes);",
        "  float lum = (0.58 + 2.35 * innerHeat + 1.45 * innerRim + 0.72 * midGlow) * dopplerLum;",
        "  emission = baseCol * radialEnv * structure * lum * 1.48;",
        "",
        "  // Optical absorption provides 3D foreground occlusion over shadow, photon ring & lower arch",
        "  absorption = radialEnv * (0.34 + 1.25 * darkLanes + 0.42 * clouds + 0.24 * silk) * 1.35;",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Local ACES Fallback (only active if all offscreen FBOs fail)",
        "// ---------------------------------------------------------------------",
        "vec3 acesFilmLocal(vec3 x) {",
        "  float a = 2.51;",
        "  float b = 0.03;",
        "  float c = 2.43;",
        "  float d = 0.59;",
        "  float e = 0.14;",
        "  return clamp((x * (a * x + b)) / max(x * (c * x + d) + e, vec3(0.0001)), 0.0, 1.0);",
        "}",
        "",
        "// ---------------------------------------------------------------------",
        "// Main Singularity-Free 3D Cartesian Velocity Verlet Raytracer",
        "// ---------------------------------------------------------------------",
        "void main() {",
        "  vec2 uv = v_uv * 2.0 - 1.0;",
        "  float aspect = u_resolution.x / max(u_resolution.y, 1.0);",
        "  uv.x *= aspect;",
        "",
        "  vec3 ro = u_camPos;",
        "  vec3 rd = normalize(u_camForward + uv.x * u_fovScale * u_camRight + uv.y * u_fovScale * u_camUp);",
        "",
        "  // Conserved specific angular momentum squared h^2 = |ro x rd|^2",
        "  // Smoothly vanishes as b -> 0, eliminating all polar singularities & center bullseyes",
        "  vec3 hVec = cross(ro, rd);",
        "  float h2 = dot(hVec, hVec);",
        "  float b = sqrt(max(h2, 0.0));",
        "  float r0 = length(ro);",
        "  float bCrit = inversesqrt(2.0 / 27.0 + 1.0 / max(r0 * r0 * r0, 1.0));",
        "",
        "  // Interleaved Gradient Noise jitter (applied ONLY to the initial step to prevent slice banding)",
        "  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));",
        "",
        "  vec3 p = ro;",
        "  vec3 v = rd;",
        "  float r2 = dot(p, p);",
        "  float invR = inversesqrt(max(r2, 0.0001));",
        "  float invR2 = invR * invR;",
        "  vec3 acc = (-1.5 * h2 * invR2 * invR2 * invR) * p;",
        "",
        "  vec3 accumColor = vec3(0.0);",
        "  float transmittance = 1.0;",
        "  float frontTrans = 1.0;",
        "  bool captured = false;",
        "  bool escaped = false;",
        "  float crossCount = 0.0;",
        "",
        "  // Strict compile-time constant loop bound (MAX_STEPS = 120)",
        "  for (int i = 0; i < MAX_STEPS; i++) {",
        "    if (float(i) >= u_maxSteps) break;",
        "",
        "    float r = 1.0 / max(invR, 0.0001);",
        "    float vLen = max(length(v), 0.25);",
        "    float rvDot = dot(p, v);",
        "",
        "    // Smooth adaptive step size dt: fine near photon sphere & disk slab, nimble in outer void",
        "    float dtGeo = mix(0.064, 0.135, smoothstep(2.0, 14.0, r)) * r;",
        "    if (r > R_OUT + 1.5 && rvDot > 0.0) {",
        "      dtGeo *= 1.65;",
        "    }",
        "",
        "    // Fine stepping inside the accretion disk envelope (r < R_OUT + 1.5 && |y| < 1.2)",
        "    float inDiskR = 1.0 - smoothstep(R_OUT + 0.4, R_OUT + 1.6, r);",
        "    float inDiskY = 1.0 - smoothstep(0.65, 1.25, abs(p.y));",
        "    float diskZone = inDiskR * inDiskY;",
        "    float dtDisk = mix(0.15, 0.48, clamp((r - R_IN) / max(R_OUT - R_IN, 0.001), 0.0, 1.0));",
        "",
        "    float dt = mix(dtGeo, min(dtGeo, dtDisk), diskZone);",
        "    dt = clamp(dt / vLen, 0.042, 2.8) * u_stepScale;",
        "",
        "    // Micro sub-pixel jitter on first step only completely erases volumetric step slices",
        "    if (i == 0) {",
        "      dt *= (0.45 + 0.55 * ign);",
        "    }",
        "",
        "    // Symplectic Velocity Verlet step (single acceleration evaluation per iteration)",
        "    vec3 pNext = p + v * dt + 0.5 * acc * (dt * dt);",
        "    float r2Next = dot(pNext, pNext);",
        "    float invRNext = inversesqrt(max(r2Next, 0.0001));",
        "    float invR2Next = invRNext * invRNext;",
        "    vec3 accNext = (-1.5 * h2 * invR2Next * invR2Next * invRNext) * pNext;",
        "    vec3 vNext = v + 0.5 * (acc + accNext) * dt;",
        "",
        "    // 1) Strict Event Horizon Absorption (r <= 1.008 -> immediate pitch-black termination)",
        "    float rNext = 1.0 / max(invRNext, 0.0001);",
        "    if (rNext <= R_HORIZON) {",
        "      captured = true;",
        "      break;",
        "    }",
        "",
        "    // 2) Hybrid Accretion Disk Integration (Equatorial Plane + Thin Volumetric Plasma)",
        "    float rMinSeg = min(r, rNext);",
        "    float rMaxSeg = max(r, rNext);",
        "    if (rMinSeg < R_OUT + 0.35 && rMaxSeg > R_IN - 0.15) {",
        "      vec3 segVec = pNext - p;",
        "      float segLen = length(segVec);",
        "      vec3 rayDir = segVec / max(segLen, 0.00001);",
        "      float absDirY = abs(rayDir.y);",
        "",
        "      // Smoothly transition from pure volumetric (edge-on 0 deg) to crisp hybrid (angled)",
        "      float planeBlend = smoothstep(0.035, 0.24, absDirY);",
        "      float volWeight = mix(1.0, 0.42, planeBlend);",
        "",
        "      // Dampen faint 2nd-order inner echoes so the dark gap beside the photon ring stays crisp",
        "      float bendCos = dot(rayDir, rd);",
        "      float orderDamp = (crossCount >= 1.5 && bendCos < -0.65) ? 0.30 : 1.0;",
        "",
        "      // (A) Thin Volumetric Plasma Layer (|y| < 3.0 * H(r))",
        "      vec3 pMid = 0.5 * (p + pNext);",
        "      float rMid = length(pMid);",
        "      float H = diskHalfHeight(clamp(rMid, R_IN, R_OUT));",
        "      float yNorm = pMid.y / H;",
        "      float y2 = yNorm * yNorm;",
        "      if (y2 < 9.0) {",
        "        vec3 emV;",
        "        float abV;",
        "        evaluateDiskProperties(pMid, rayDir, rMid, yNorm, emV, abV);",
        "        float vProfile = 0.50 * exp(-0.55 * y2) + 0.50 * exp(-1.35 * y2);",
        "        // Keep volumetric density clean & physically scaled with segment length",
        "        float dsVol = segLen * volWeight * orderDamp;",
        "        vec3 emStep = emV * vProfile * 1.15;",
        "        float abStep = abV * exp(-0.55 * y2) * 0.95;",
        "        float segT = exp(-abStep * dsVol);",
        "        vec3 segL = (abStep > 0.0005) ? (emStep / abStep) * (1.0 - segT) : emStep * dsVol;",
        "        accumColor += transmittance * segL;",
        "        transmittance *= segT;",
        "      }",
        "",
        "      // (B) Exact Equatorial Plane Crossing (y = 0) for Ultra-Sharp Silk Filaments",
        "      if ((p.y <= 0.0 && pNext.y > 0.0) || (p.y >= 0.0 && pNext.y < 0.0)) {",
        "        crossCount += 1.0;",
        "        if (planeBlend > 0.001) {",
        "          float tHit = abs(p.y) / max(abs(p.y) + abs(pNext.y), 0.00001);",
        "          vec3 pHit = mix(p, pNext, tHit);",
        "          float rHit = length(pHit);",
        "          if (rHit >= R_IN - 0.08 && rHit <= R_OUT + 0.20) {",
        "            vec3 emP;",
        "            float abP;",
        "            evaluateDiskProperties(pHit, rayDir, rHit, 0.0, emP, abP);",
        "            float hHit = diskHalfHeight(rHit);",
        "            // Exact optical path through thin slab at incidence angle",
        "            float pathPlane = (2.1 * hHit / max(absDirY, 0.22)) * planeBlend * orderDamp;",
        "            float pT = exp(-abP * pathPlane * 0.92);",
        "            vec3 pL = (abP > 0.0005) ? (emP / abP) * (1.0 - pT) : emP * pathPlane;",
        "            accumColor += transmittance * pL * 1.18;",
        "            transmittance *= pT;",
        "          }",
        "        }",
        "      }",
        "    }",
        "",
        "    // Lock foreground disk transmittance while ray is still approaching closest point",
        "    if (rvDot < 0.0) {",
        "      frontTrans = transmittance;",
        "    }",
        "",
        "    p = pNext;",
        "    v = vNext;",
        "    invR = invRNext;",
        "    acc = accNext;",
        "",
        "    if (transmittance < 0.004) {",
        "      transmittance = 0.0;",
        "      break;",
        "    }",
        "",
        "    // 3) Strict Escape to Spatial Infinity (r > 32.0 && dot(p, v) > 0.0)",
        "    if (rNext > R_ESCAPE && dot(p, v) > 0.0) {",
        "      escaped = true;",
        "      break;",
        "    }",
        "  }",
        "",
        "  // Fallback classification if a ray remained tightly grazing photon sphere at MAX_STEPS",
        "  if (!captured && !escaped) {",
        "    if (dot(ro, rd) < 0.0 && b <= bCrit + 0.001) {",
        "      captured = true;",
        "    } else {",
        "      escaped = true;",
        "    }",
        "  }",
        "",
        "  // Add gravitationally-deflected deep space starfield ONLY for escaping rays",
        "  if (escaped && !captured && transmittance > 0.001) {",
        "    vec3 escDir = normalize(v);",
        "    accumColor += transmittance * sampleSpaceBackdrop(escDir);",
        "  }",
        "",
        "  // Razor-thin (1.0 - 1.8px) sharp ivory-white Photon Ring hugging shadow outer rim (b = bCrit)",
        "  // Properly occluded by foreground accretion disk via frontTrans",
        "  if (dot(ro, rd) < 0.0) {",
        "    float pxB = (2.0 * r0 * u_fovScale) / max(u_resolution.y, 1.0);",
        "    float ringW = clamp(pxB * 0.92, 0.011, 0.032);",
        "    float ringC = bCrit + ringW * 0.65;",
        "    float innerCut = smoothstep(bCrit - pxB * 0.32, bCrit + pxB * 0.32, b);",
        "    float db = (b - ringC) / ringW;",
        "    float coreLine = exp(-(db * db)) * innerCut;",
        "    float fineWhisper = exp(-max(b - ringC, 0.0) / max(ringW * 2.0, 0.024)) * innerCut * 0.09;",
        "    float ringEnergy = coreLine + fineWhisper;",
        "    if (ringEnergy > 0.001) {",
        "      float asym = 0.88 + 0.22 * clamp(-uv.x * 0.65, -1.0, 1.0);",
        "      vec3 photonCol = vec3(1.00, 0.96, 0.895);",
        "      accumColor += frontTrans * photonCol * ringEnergy * 2.25 * asym;",
        "    }",
        "  }",
        "",
        "  // Guaranteed finite non-negative HDR output",
        "  accumColor = clamp(accumColor, vec3(0.0), vec3(24.0));",
        "",
        "  if (u_directOutput > 0.5) {",
        "    vec3 mapped = acesFilmLocal(accumColor * 1.04);",
        "    mapped = pow(max(mapped, vec3(0.0001)), vec3(1.0 / 2.2));",
        "    gl_FragColor = vec4(clamp(mapped, 0.0, 1.0), 1.0);",
        "  } else if (u_encodeHDR > 0.5) {",
        "    vec3 enc = accumColor / (accumColor + vec3(3.0));",
        "    gl_FragColor = vec4(sqrt(max(enc, vec3(0.0))), 1.0);",
        "  } else {",
        "    gl_FragColor = vec4(accumColor, 1.0);",
        "  }",
        "}"
      ].join("\n");

      /**
       * PASS 2: 1/4-Resolution Soft-Knee HDR Bright-Pass Extraction (Threshold = 1.05)
       */
      const FRAG_BRIGHTPASS = [
        "#ifdef GL_FRAGMENT_PRECISION_HIGH",
        "precision highp float;",
        "#else",
        "precision mediump float;",
        "#endif",
        "",
        "varying vec2 v_uv;",
        "uniform sampler2D u_tex;",
        "uniform vec2 u_texelSize;",
        "uniform float u_decodeHDR;",
        "",
        "vec3 readLinear(vec2 uv) {",
        "  vec3 c = texture2D(u_tex, clamp(uv, vec2(0.001), vec2(0.999))).rgb;",
        "  if (u_decodeHDR > 0.5) {",
        "    c = c * c;",
        "    c = 3.0 * c / max(vec3(1.0) - c, vec3(0.004));",
        "  }",
        "  return clamp(c, vec3(0.0), vec3(24.0));",
        "}",
        "",
        "void main() {",
        "  vec3 c0 = readLinear(v_uv + vec2(-u_texelSize.x, -u_texelSize.y));",
        "  vec3 c1 = readLinear(v_uv + vec2( u_texelSize.x, -u_texelSize.y));",
        "  vec3 c2 = readLinear(v_uv + vec2(-u_texelSize.x,  u_texelSize.y));",
        "  vec3 c3 = readLinear(v_uv + vec2( u_texelSize.x,  u_texelSize.y));",
        "  vec3 col = 0.25 * (c0 + c1 + c2 + c3);",
        "",
        "  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));",
        "  float threshold = 1.05;",
        "  float knee = 0.45;",
        "  float soft = clamp(luma - threshold + knee, 0.0, 2.0 * knee);",
        "  soft = (soft * soft) / max(4.0 * knee, 0.0001);",
        "  float contrib = max(soft, luma - threshold) / max(luma, 0.0001);",
        "",
        "  vec3 bright = clamp(col * contrib, vec3(0.0), vec3(24.0));",
        "",
        "  if (u_decodeHDR > 0.5) {",
        "    vec3 enc = bright / (bright + vec3(3.0));",
        "    gl_FragColor = vec4(sqrt(max(enc, vec3(0.0))), 1.0);",
        "  } else {",
        "    gl_FragColor = vec4(bright, 1.0);",
        "  }",
        "}"
      ].join("\n");

      /**
       * PASS 3-9: Lightweight 5-Tap Hardware-Bilinear Separable Gaussian Blur
       */
      const FRAG_BLUR = [
        "#ifdef GL_FRAGMENT_PRECISION_HIGH",

        "#else",
        "precision mediump float;",
        "#endif",

        "uniform float u_decodeHDR;",

        "  sum += (readLinear(v_uv + u_direction * 3.230769) + readLinear(v_uv - u_direction * 3.230769)) * 0.070270;",
        "  sum = clamp(sum, vec3(0.0), vec3(24.0));",

      /**
       * PASS 10: Final Composite — 3-Tier Multiscale Warm-Ivory HDR Bloom (1/4, 1/8, 1/16)
       * + Subtle Anamorphic Streak + Shadow-Safe Black Toe + ACES Filmic + 70mm Grain
       */
      const FRAG_COMPOSITE = [
        "#ifdef GL_FRAGMENT_PRECISION_HIGH",
        "precision highp float;",
        "#else",
        "precision mediump float;",
        "#endif",
        "",
        "varying vec2 v_uv;",

        "uniform sampler2D u_bloomMidTex;",
        "uniform sampler2D u_bloomWideTex;",

        "",

        "  vec3 scene  = readLinear(u_sceneTex, v_uv);",
        "  vec3 tight  = readLinear(u_bloomTightTex, v_uv);",

        "",

      /* =======================================================================

      const QUALITY_PRESETS = {
